suite: drupal database
templates:
  - drupal-configmap.yaml
  - drupal-deployment.yaml
  - drupal-secret.yaml
  - mariadb-ha.yaml
capabilities:
  apiVersions:
    - pxc.percona.com/v1
    - k8s.mariadb.com/v1alpha1
tests:
  - it: sets mariadb user
    template: drupal-deployment.yaml
    set:
      mariadb.db.user: testuser
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: testuser

  - it: sets mariadb user in drupal environment if mariadb explicitly enabled
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: true
      mariadb.db.user: testuser
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: testuser

  - it: sets no mariadb user in drupal environment if mariadb disabled
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: false
      mariadb.db.user: testuser
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: testuser
  - it: sets correct db environments when dbms is enabled
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: true
      pxc-db.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_DB_HOST
            value: RELEASE-NAME-mariadb
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PXC_DB_HOST
            value: RELEASE-NAME-proxysql
  - it: does not set db environments when dbms are disabled
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: false
      pxc-db.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_DB_HOST
            value: RELEASE-NAME-mariadb
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PXC_DB_HOST
            value: RELEASE-NAME-proxysql
  - it: sets correct db host when mariadb enabled and primary db
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: true
      pxc-db.enabled: true
      db.primary: mariadb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: RELEASE-NAME-mariadb
  - it: sets correct db host when pxc enabled and primary db
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: true
      pxc-db.enabled: true
      db.primary: pxc-db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: RELEASE-NAME-proxysql
  - it: sets correct db environments when mariadb-ha enabled and primary db
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: false
      mariadb-ha.enabled: true
      db.primary: mariadb-ha
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: root
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: RELEASE-NAME-mariadb-ha-primary
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-mariadb-ha
                key: root-password
  - it: creates drupal user and database in mariadb-ha
    template: mariadb-ha.yaml
    documentIndex: 0
    set:
      mariadb-ha.enabled: true
    asserts:
      - isKind:
          of: MariaDB
      - equal:
          path: spec.database
          value: drupal
      - equal:
          path: spec.username
          value: drupal
      - equal:
          path: spec.podDisruptionBudget.maxUnavailable
          value: 1
  - it: fails on even mariadb-ha replica count
    template: mariadb-ha.yaml
    set:
      mariadb-ha.enabled: true
      mariadb-ha.replicas: 4
    asserts:
      - failedTemplate:
          errorMessage: mariadb-ha.replicas must be an odd number, at least 3
  - it: fails on too few mariadb-ha replicas
    template: mariadb-ha.yaml
    set:
      mariadb-ha.enabled: true
      mariadb-ha.replicas: 1
    asserts:
      - failedTemplate:
          errorMessage: mariadb-ha.replicas must be an odd number, at least 3
  - it: sets custom mariadb-ha database name and user in environment
    template: drupal-deployment.yaml
    set:
      mariadb.enabled: false
      mariadb-ha.enabled: true
      mariadb-ha.db.name: custom
      mariadb-ha.db.user: customuser
      db.primary: mariadb-ha
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_NAME
            value: custom
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_HA_DB_NAME
            value: custom
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_HA_DB_USER
            value: customuser
  - it: sets custom mariadb-ha database name and user in MariaDB resource
    template: mariadb-ha.yaml
    documentIndex: 0
    set:
      mariadb-ha.enabled: true
      mariadb-ha.db.name: custom
      mariadb-ha.db.user: customuser
    asserts:
      - equal:
          path: spec.database
          value: custom
      - equal:
          path: spec.username
          value: customuser
  - it: sets mariadb-ha passwords in secret
    template: mariadb-ha.yaml
    documentIndex: 1
    set:
      mariadb-ha.enabled: true
      mariadb-ha.db.password: userpass
      mariadb-ha.rootUser.password: rootpass
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.password
          value: dXNlcnBhc3M=
      - equal:
          path: data.root-password
          value: cm9vdHBhc3M=
