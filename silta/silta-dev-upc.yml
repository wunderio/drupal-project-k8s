# Configure reference data that will be used when creating new environments.
referenceData:
  enabled: true
  referenceEnvironment: 'feature/dev-upc-cluster/reference'

# Settings for default site provided by this deployment
ssl:
  enabled:  true
  # issuer: cloudflare
  issuer: letsencrypt

exposeDomains:
  cftest:
    hostname: cftest.dev-upc.silta.cloud
    ssl:
      enabled: true
      issuer: cloudflare
  cftest2:
    hostname: test2.dev-upc.silta.cloud
    ssl:
      enabled: true
  cftest3:
    hostname: test3.dev-upc.silta.cloud
    ssl:
      enabled: true
      issuer: custom
      crt: |-
        -----BEGIN CERTIFICATE-----
        -----END CERTIFICATE-----
      key: |-
        -----BEGIN RSA PRIVATE KEY-----
        -----END RSA PRIVATE KEY-----
      ca: |-
        -----BEGIN CERTIFICATE-----
        -----END CERTIFICATE-----
  cftest4:
    hostname: test4.dev-upc.silta.cloud
    ssl:
      enabled: true
      issuer: selfsigned

  cftest5:
    hostname: test5.dev-upc.silta.cloud
    ssl:
      enabled: false
